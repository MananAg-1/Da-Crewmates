<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Space Upvote Rocket</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { margin: 0; height: 100vh; background: #0b0d12; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: system-ui; overflow: hidden; gap: 0; }

.notification {
  position: fixed; top: 18px; left: 50%; transform: translateX(-50%) translateY(-80px);
  padding: 10px 18px; border-radius: 18px; font-size: 15px; font-weight: 500; color: #fff;
  opacity: 0; pointer-events: none; z-index: 1000; white-space: nowrap;
  transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow: 0 4px 18px rgba(0,0,0,0.4);
}
.notification.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#notif-up   { background: #1a7a40; }
#notif-down { background: #a01a1a; }
.notif-tail { position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); width: 0; height: 0; }
.notif-tail.green { border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 9px solid #1a7a40; }
.notif-tail.red   { border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 9px solid #a01a1a; }

.stages { display: flex; gap: 40px; align-items: flex-end; }

.launch-area { display: flex; flex-direction: column; align-items: center; gap: 10px; }

.counter-box {
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.13);
  border-radius: 14px; padding: 8px 20px; text-align: center; min-width: 80px;
  transition: background 0.4s ease, border-color 0.4s ease;
}
.counter-label { font-size: 10px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 3px; }
.counter-label.up   { color: #00c97a; }
.counter-label.down { color: #ff5555; }
.counter-num { font-size: 20px; font-weight: 700; color: #fff; }

.counter-box.active-up   { background: rgba(0,201,122,0.18) !important; border-color: rgba(0,201,122,0.55) !important; }
.counter-box.active-down { background: rgba(255,60,0,0.18)  !important; border-color: rgba(255,60,0,0.55)   !important; }

.scene { position: relative; width: 110px; height: 360px; }

.bar {
  width: 110px; height: 360px; border-radius: 26px;
  background: linear-gradient(180deg, #151923, #0c0f16);
  border: 1px solid rgba(255,255,255,0.08);
  position: absolute; top: 0; left: 0;
  transition: background 0.6s ease, border-color 0.6s ease, box-shadow 0.6s ease;
  overflow: hidden; cursor: pointer;
}
.bar-up.success { background: linear-gradient(180deg, #0f2a18, #0b1c12); border-color: rgba(0,255,120,0.35); box-shadow: 0 0 30px rgba(0,255,120,0.15); }
.bar-down.boom  { background: linear-gradient(180deg, #2a0a0a, #1a0505); border-color: rgba(255,60,0,0.5);  box-shadow: 0 0 40px rgba(255,60,0,0.3); }

.bar-label {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  pointer-events: none; user-select: none; opacity: 0.35;
}
.bar-up   .bar-label { color: #00c97a; }
.bar-down .bar-label { color: #ff5555; }

.rocket { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); width:36px; z-index:10; pointer-events:none; }
.rocket svg { display:block; width:36px; height:auto; }

.flame-wrap {
  position:absolute; bottom:-54px; left:50%; transform:translateX(-50%);
  opacity:0; width:40px; display:flex; flex-direction:column; align-items:center; pointer-events:none;
}
.halo { width:38px; height:14px; border-radius:50%; background:rgba(255,120,0,0.3); filter:blur(7px); margin-bottom:-8px; }
.flame-group { position:relative; width:28px; height:52px; }
.flame-layer { position:absolute; bottom:0; left:50%; transform:translateX(-50%); border-radius:50% 50% 30% 30%/60% 60% 40% 40%; animation:flick 0.13s infinite alternate ease-in-out; }
.fl-red    { width:28px; height:52px; background:#c0200a; z-index:1; animation-delay:0s; }
.fl-yellow { width:20px; height:42px; background:#f5c000; z-index:2; animation-delay:0.04s; }
.fl-orange { width:13px; height:30px; background:#ff7000; z-index:3; animation-delay:0.08s; }
@keyframes flick {
  0%   { transform:translateX(-50%) scaleX(1)    scaleY(1); }
  50%  { transform:translateX(-50%) scaleX(0.82) scaleY(1.15); }
  100% { transform:translateX(-50%) scaleX(1.12) scaleY(0.88); }
}

.pad { position:absolute; bottom:-28px; left:50%; transform:translateX(-50%); width:60px; height:6px; background:rgba(255,255,255,0.07); border-radius:3px; border:1px solid rgba(255,255,255,0.12); opacity:0; transition:opacity 0.3s ease; }
.pad.show { opacity:1; }

.confetti-stage { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:999; }
.cp { position:absolute; width:7px; height:11px; opacity:0; animation:cfall 1.4s ease-out forwards; border-radius:2px; }
@keyframes cfall { 0%{opacity:1;transform:translateY(0) rotate(0deg) scale(1);}100%{opacity:0;transform:translateY(200px) rotate(420deg) scale(0.3);} }
@keyframes flashOut { 0%{opacity:1;transform:scale(0.2);}50%{opacity:0.9;transform:scale(1.2);}100%{opacity:0;transform:scale(1.6);} }
</style>
</head>
<body>

<div id="notif-up" class="notification">Your upvote was a success ✓<div class="notif-tail green"></div></div>
<div id="notif-down" class="notification">Mission failed ✕<div class="notif-tail red"></div></div>

<div class="stages">

  <!-- UPVOTE SIDE -->
  <div class="launch-area">
    <div class="counter-box" id="box-up">
      <div class="counter-label up">Upvotes</div>
      <div class="counter-num" id="score-up">33</div>
    </div>
    <div class="scene" id="scene-up">
      <div class="bar bar-up" id="bar-up">
        <div class="bar-label">↑ upvote</div>
      </div>
      <div class="rocket" id="rocket-up">
        <svg viewBox="0 0 36 130" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 46 Q10 10 18 2 Q26 10 26 46 Z" fill="#e8e8e8"/>
          <line x1="18" y1="4" x2="18" y2="46" stroke="#bbb" stroke-width="0.5"/>
          <rect x="9" y="46" width="18" height="7" fill="#111" rx="1"/>
          <rect x="10" y="53" width="16" height="28" fill="#e8e8e8" rx="1"/>
          <rect x="11" y="79" width="14" height="3" fill="#ccc" rx="0.5"/>
          <rect x="9" y="82" width="18" height="30" fill="#f0f0f0" rx="1"/>
          <text x="18" y="97" text-anchor="middle" font-family="Arial,sans-serif" font-size="4" font-weight="700" fill="#111" letter-spacing="1">SPACEX</text>
          <line x1="9"  y1="108" x2="5"  y2="118" stroke="#888" stroke-width="1.2" stroke-linecap="round"/>
          <line x1="27" y1="108" x2="31" y2="118" stroke="#888" stroke-width="1.2" stroke-linecap="round"/>
          <rect x="6"  y="84" width="3" height="5" fill="#555" rx="0.5"/>
          <rect x="27" y="84" width="3" height="5" fill="#555" rx="0.5"/>
          <rect x="10" y="112" width="16" height="6" fill="#222" rx="1"/>
          <ellipse cx="14" cy="118" rx="3"   ry="2" fill="#333"/>
          <ellipse cx="18" cy="119" rx="3.5" ry="2" fill="#2a2a2a"/>
          <ellipse cx="22" cy="118" rx="3"   ry="2" fill="#333"/>
          <rect x="9" y="96" width="18" height="5" fill="#1a1a1a"/>
          <rect x="11" y="86" width="5" height="3" fill="#b22234" rx="0.3"/>
          <rect x="11" y="87" width="5" height="1" fill="#fff"/>
          <rect x="11" y="87.5" width="2" height="1.5" fill="#3c3b6e"/>
        </svg>
        <div class="flame-wrap" id="flame-up">
          <div class="halo"></div>
          <div class="flame-group">
            <div class="flame-layer fl-red"></div>
            <div class="flame-layer fl-yellow"></div>
            <div class="flame-layer fl-orange"></div>
          </div>
        </div>
      </div>
      <div class="pad" id="pad-up"></div>
    </div>
  </div>

  <!-- DOWNVOTE SIDE -->
  <div class="launch-area">
    <div class="counter-box" id="box-down">
      <div class="counter-label down">Downvotes</div>
      <div class="counter-num" id="score-down">33</div>
    </div>
    <div class="scene" id="scene-down">
      <div class="bar bar-down" id="bar-down">
        <div class="bar-label">↓ downvote</div>
      </div>
      <div class="rocket" id="rocket-down">
        <svg viewBox="0 0 36 130" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 46 Q10 10 18 2 Q26 10 26 46 Z" fill="#e8e8e8"/>
          <line x1="18" y1="4" x2="18" y2="46" stroke="#bbb" stroke-width="0.5"/>
          <rect x="9" y="46" width="18" height="7" fill="#111" rx="1"/>
          <rect x="10" y="53" width="16" height="28" fill="#e8e8e8" rx="1"/>
          <rect x="11" y="79" width="14" height="3" fill="#ccc" rx="0.5"/>
          <rect x="9" y="82" width="18" height="30" fill="#f0f0f0" rx="1"/>
          <text x="18" y="97" text-anchor="middle" font-family="Arial,sans-serif" font-size="4" font-weight="700" fill="#111" letter-spacing="1">SPACEX</text>
          <line x1="9"  y1="108" x2="5"  y2="118" stroke="#888" stroke-width="1.2" stroke-linecap="round"/>
          <line x1="27" y1="108" x2="31" y2="118" stroke="#888" stroke-width="1.2" stroke-linecap="round"/>
          <rect x="6"  y="84" width="3" height="5" fill="#555" rx="0.5"/>
          <rect x="27" y="84" width="3" height="5" fill="#555" rx="0.5"/>
          <rect x="10" y="112" width="16" height="6" fill="#222" rx="1"/>
          <ellipse cx="14" cy="118" rx="3"   ry="2" fill="#333"/>
          <ellipse cx="18" cy="119" rx="3.5" ry="2" fill="#2a2a2a"/>
          <ellipse cx="22" cy="118" rx="3"   ry="2" fill="#333"/>
          <rect x="9" y="96" width="18" height="5" fill="#1a1a1a"/>
          <rect x="11" y="86" width="5" height="3" fill="#b22234" rx="0.3"/>
          <rect x="11" y="87" width="5" height="1" fill="#fff"/>
          <rect x="11" y="87.5" width="2" height="1.5" fill="#3c3b6e"/>
        </svg>
        <div class="flame-wrap" id="flame-down">
          <div class="halo"></div>
          <div class="flame-group">
            <div class="flame-layer fl-red"></div>
            <div class="flame-layer fl-yellow"></div>
            <div class="flame-layer fl-orange"></div>
          </div>
        </div>
      </div>
      <div class="pad" id="pad-down"></div>
    </div>
  </div>

</div>

<div class="confetti-stage" id="cStage"></div>

<script>
const barUp    = document.getElementById("bar-up");
const barDown  = document.getElementById("bar-down");
const rocketUp = document.getElementById("rocket-up");
const rocketDn = document.getElementById("rocket-down");
const flameUp  = document.getElementById("flame-up");
const flameDn  = document.getElementById("flame-down");
const padUp    = document.getElementById("pad-up");
const padDn    = document.getElementById("pad-down");
const scoreUp  = document.getElementById("score-up");
const scoreDn  = document.getElementById("score-down");
const boxUp    = document.getElementById("box-up");
const boxDn    = document.getElementById("box-down");
const notifUp  = document.getElementById("notif-up");
const notifDn  = document.getElementById("notif-down");
const cStage   = document.getElementById("cStage");
const confColors = ["#ff3b3b","#fff","#f5c000","#ff7000","#00e676","#64b5f6"];

let upScore = 33, downScore = 33, busyUp = false, busyDn = false;

function setActive(side) {
  boxUp.classList.remove("active-up");
  boxDn.classList.remove("active-down");
  if (side === "up")   boxUp.classList.add("active-up");
  if (side === "down") boxDn.classList.add("active-down");
}

function resetRocket(r, f) {
  r.getAnimations().forEach(a => a.cancel());
  r.style.cssText = "position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:36px;z-index:10;opacity:1;pointer-events:none;";
  f.style.opacity = "0";
}

function showNotif(el) {
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2200);
}

function spawnConfetti() {
  const cx = window.innerWidth / 2 - 60, cy = window.innerHeight * 0.4;
  for (let i = 0; i < 50; i++) {
    const c = document.createElement("div");
    c.className = "cp";
    c.style.cssText = `left:${cx-90+Math.random()*180}px;top:${cy-50+Math.random()*70}px;background:${confColors[Math.floor(Math.random()*confColors.length)]};transform:rotate(${Math.random()*360}deg);animation-delay:${Math.random()*0.4}s`;
    cStage.appendChild(c);
    setTimeout(() => c.remove(), 1800);
  }
}

function explodeAt(cx, cy) {
  const flash = document.createElement("div");
  flash.style.cssText = `position:fixed;left:${cx-80}px;top:${cy-80}px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#ff9000 30%,#ff3000 65%,transparent 100%);z-index:998;pointer-events:none;animation:flashOut 0.6s ease-out forwards;`;
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 700);

  const debrisColors = ["#ff6600","#ffaa00","#ffffff","#ff3300","#ffdd00","#aaaaaa","#ff8800"];
  const shapes = [{w:8,h:3},{w:4,h:12},{w:6,h:6},{w:3,h:9},{w:10,h:4},{w:5,h:5},{w:7,h:3},{w:3,h:7},{w:9,h:5},{w:4,h:4},{w:6,h:3},{w:3,h:8},{w:8,h:8},{w:5,h:3},{w:3,h:6},{w:7,h:7},{w:4,h:5},{w:6,h:4},{w:3,h:3},{w:9,h:3}];
  shapes.forEach((s, i) => {
    const d = document.createElement("div");
    const angle = (i / shapes.length) * 360 + Math.random() * 20;
    const dist = 60 + Math.random() * 120;
    const rad = angle * Math.PI / 180;
    const tx = Math.cos(rad) * dist, ty = Math.sin(rad) * dist;
    d.style.cssText = `position:fixed;left:${cx}px;top:${cy}px;width:${s.w}px;height:${s.h}px;background:${debrisColors[Math.floor(Math.random()*debrisColors.length)]};border-radius:2px;z-index:997;pointer-events:none;`;
    document.body.appendChild(d);
    d.animate([
      { opacity:1, transform:`translate(0,0) rotate(0deg)`, offset:0 },
      { opacity:1, transform:`translate(${tx*0.4}px,${ty*0.4-40}px) rotate(${Math.random()*180}deg)`, offset:0.3 },
      { opacity:0, transform:`translate(${tx}px,${ty+80}px) rotate(${Math.random()*360}deg)`, offset:1 }
    ], { duration:1200+Math.random()*600, easing:"cubic-bezier(0.2,0.8,0.4,1)", fill:"forwards" });
    setTimeout(() => d.remove(), 2000);
  });

  for (let i = 0; i < 8; i++) {
    const s = document.createElement("div");
    s.style.cssText = `position:fixed;left:${cx-25+Math.random()*50}px;top:${cy-25+Math.random()*50}px;width:${20+Math.random()*30}px;height:${20+Math.random()*30}px;border-radius:50%;background:rgba(100,80,60,0.7);z-index:996;pointer-events:none;`;
    document.body.appendChild(s);
    s.animate([
      { opacity:0.8, transform:"scale(1)", offset:0 },
      { opacity:0, transform:`scale(3) translate(${-20+Math.random()*40}px,${-40-Math.random()*40}px)`, offset:1 }
    ], { duration:1500+Math.random()*500, easing:"ease-out", fill:"forwards" });
    setTimeout(() => s.remove(), 2200);
  }
}

barUp.addEventListener("click", () => {
  if (busyUp) return;
  busyUp = true;
  upScore++;
  scoreUp.textContent = upScore;
  setActive("up");
  resetRocket(rocketUp, flameUp);
  padUp.classList.add("show");
  const lh = 580;

  flameUp.style.opacity = "1";
  rocketUp.animate([
    { transform:"translateX(-50%) translateY(0px)", offset:0 },
    { transform:`translateX(-50%) translateY(-${lh*0.35}px)`, offset:0.5 },
    { transform:`translateX(-50%) translateY(-${lh}px)`, offset:1 }
  ], { duration:2000, easing:"cubic-bezier(0.4,0,0.15,1)", fill:"forwards" });

  setTimeout(() => {
    flameUp.style.opacity = "0";
    rocketUp.animate([
      { transform:`translateX(-50%) translateY(-${lh}px) rotate(0deg)`, offset:0 },
      { transform:`translateX(-30%) translateY(-${lh+40}px) rotate(20deg)`, offset:0.28 },
      { transform:`translateX(-72%) translateY(-${lh+18}px) rotate(-14deg)`, offset:0.58 },
      { transform:`translateX(-52%) translateY(-${lh+5}px) rotate(4deg)`, offset:0.82 },
      { transform:`translateX(-50%) translateY(-${lh}px) rotate(0deg)`, offset:1 }
    ], { duration:1600, easing:"ease-in-out", fill:"forwards" });
  }, 2000);

  setTimeout(() => {
    flameUp.style.opacity = "1";
    rocketUp.animate([
      { transform:`translateX(-50%) translateY(-${lh}px) rotate(0deg)`, offset:0 },
      { transform:`translateX(-50%) translateY(-280px) rotate(0deg)`, offset:0.35 },
      { transform:`translateX(-50%) translateY(-80px) rotate(0deg)`, offset:0.72 },
      { transform:`translateX(-50%) translateY(38px) rotate(0deg)`, offset:1 }
    ], { duration:2200, easing:"cubic-bezier(0.5,0,0.3,1)", fill:"forwards" });
  }, 3600);

  setTimeout(() => {
    flameUp.style.opacity = "0";
    barUp.classList.add("success");
    spawnConfetti();
    showNotif(notifUp);
  }, 5800);

  setTimeout(() => {
    barUp.classList.remove("success");
    padUp.classList.remove("show");
    resetRocket(rocketUp, flameUp);
    busyUp = false;
  }, 7200);
});

barDown.addEventListener("click", () => {
  if (busyDn) return;
  busyDn = true;
  downScore++;
  scoreDn.textContent = downScore;
  setActive("down");
  resetRocket(rocketDn, flameDn);

  flameDn.style.opacity = "1";
  rocketDn.animate([
    { transform:"translateX(-50%) translateY(0px)", offset:0 },
    { transform:"translateX(-50%) translateY(-200px)", offset:1 }
  ], { duration:1400, easing:"cubic-bezier(0.3,0,0.2,1)", fill:"forwards" });

  setTimeout(() => {
    flameDn.style.opacity = "0";
    rocketDn.style.opacity = "0";
    const rRect = rocketDn.getBoundingClientRect();
    explodeAt(rRect.left + rRect.width/2, rRect.top + rRect.height/2);
    barDown.classList.add("boom");
    showNotif(notifDn);
  }, 1400);

  setTimeout(() => {
    barDown.classList.remove("boom");
    resetRocket(rocketDn, flameDn);
    busyDn = false;
  }, 3500);
});
</script>
</body>
</html>
